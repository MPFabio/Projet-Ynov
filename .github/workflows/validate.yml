name: CI - Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VAR_project_id: kura-devops

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: kura-devops
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  k8s:
    name: Kubernetes manifests
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      - name: Lint k8s (kubectl apply dry-run)
        run: |
          for f in k8s/namespace.yaml k8s/configmap.yaml k8s/deployment.yaml k8s/service.yaml; do
            kubectl apply -f "$f" --dry-run=client --validate=false -o yaml > /dev/null || exit 1
          done
          echo "k8s manifests OK"

  ansible:
    name: Ansible syntax
    needs: k8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ansible
        run: pip install ansible
      - name: Install Ansible collection kubernetes.core
        run: ansible-galaxy collection install kubernetes.core
      - name: Ansible playbook syntax check
        run: |
          cd ansible
          ansible-playbook playbooks/configure-nodes.yml --syntax-check -i inventory/gcp.yml
          ansible-playbook playbooks/deploy-app.yml --syntax-check
